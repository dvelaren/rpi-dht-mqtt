[project]
name = "rpi-dht-mqtt"
version = "0.1.0"
description = "Raspberry Pi DHT temperature and humidity sensor publisher using MQTT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adafruit-blinka==8.58.1",
    "adafruit-circuitpython-busdevice==5.2.12",
    "adafruit-circuitpython-connectionmanager==3.1.4",
    "adafruit-circuitpython-dht==4.0.8",
    "adafruit-circuitpython-requests==4.1.12",
    "adafruit-circuitpython-typing==1.12.1",
    "adafruit-platformdetect==3.79.0",
    "adafruit-pureio==1.1.11",
    "binho-host-adapter==0.1.6",
    "lgpio==0.2.2.0",
    "paho-mqtt==2.1.0",
    "pyftdi==0.56.0",
    "pyserial==3.5",
    "python-dotenv==1.1.0",
    "pyusb==1.3.1",
    "rpi-lgpio==0.6",
    "sysv-ipc==1.1.0",
    "typing-extensions==4.14.0",
]
